spring.application.name=kafka-pause-resume
server.port=8080

# Kafka broker — punta al docker-compose locale
spring.kafka.bootstrap-servers=localhost:9092

# -------------------------------------------------------
# Parametri consumer — configurati per task lunghi
# -------------------------------------------------------

# Consumer group
app.kafka.consumer.group-id=task-workers

# Tempo massimo (ms) tra due poll() consecutive.
# Kafka considera il consumer morto se non chiama poll() entro questo tempo.
# Impostalo > durata massima del tuo task.
# Qui 10 minuti per i test (in prod potresti metterlo a 2 ore)
app.kafka.consumer.max-poll-interval-ms=600000

# Un solo record per poll(): con pause/resume elaboriamo un task
# alla volta per partizione — non vogliamo "riempire il buffer"
app.kafka.consumer.max-poll-records=1

# Heartbeat e session timeout
app.kafka.consumer.heartbeat-interval-ms=10000
app.kafka.consumer.session-timeout-ms=60000

# Topic
app.kafka.topic.input=tasks.input

# Log più verboso per osservare il comportamento
logging.level.com.example.kafka=DEBUG
logging.level.org.apache.kafka.clients.consumer=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
